# Trusted main/tag/manual Android builds use the repository-dedicated NAS Runner.
# Every PR, Android emulator and native macOS/Windows job stays on GitHub cloud.
# - Every push / pull request: run core tests + lint, build APKs and the module ZIP, and the macOS / Windows
#   desktop installers (each on its own system, jpackage cannot cross-build); keep them as downloadable artifacts.
# - Pushing a tag like v0.5.0-preview: additionally creates a *draft* GitHub Release with all those files attached.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Certificate of the key that signed every published preview so far. Phones can only upgrade in place,
  # and the runtime module only trusts the APK, when this matches. It is public (visible in any APK).
  EXPECTED_SIGNER: f6a7affdc167f75bae411a26979ee529500af8179475117fdeb94b1bb32426be

jobs:
  build:
    runs-on: ${{ (github.event_name == 'pull_request' || vars.CI_RUNNER == 'github') && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "nas-fuckpo0jixian"]') }}
    timeout-minutes: 40
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require native module packaging tools on NAS
        if: runner.environment == 'self-hosted'
        run: |
          if ! command -v zip; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip
          fi
          command -v zip
          command -v shasum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5  # v6 adds proprietary caching terms

      - name: Verify Java also uses the NAS proxy
        if: runner.environment == 'self-hosted'
        run: |
          cat > "$RUNNER_TEMP/ProxyCheck.java" <<'JAVA'
          import java.net.*;
          import java.io.*;
          public class ProxyCheck {
            public static void main(String[] args) throws Exception {
              var c = new URL("https://www.cloudflare.com/cdn-cgi/trace").openConnection();
              c.setConnectTimeout(15000); c.setReadTimeout(15000);
              try (var r = new BufferedReader(new InputStreamReader(c.getInputStream()))) {
                var country = r.lines().filter(x -> x.startsWith("loc=")).findFirst().orElse("");
                if (!country.equals("loc=DE")) throw new IllegalStateException("Expected DE Java proxy exit");
                System.out.println("Java/SDK/Gradle proxy exit: DE");
              }
            }
          }
          JAVA
          java "$RUNNER_TEMP/ProxyCheck.java"

      - name: Install Android command-line tools on NAS
        if: runner.environment == 'self-hosted'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        if: runner.environment != 'self-hosted'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            path="$RUNNER_TEMP/fuckpo0jixian-debug.keystore"
            printf '%s' "$KEYSTORE" | base64 -d > "$path"
            echo "FUCKPO0JIXIAN_KEYSTORE=$path" >> "$GITHUB_ENV"
            # Public certificate fingerprint only; the key itself never reaches the log.
            keytool -list -v -keystore "$path" -storepass android -alias androiddebugkey | grep 'SHA256:'
          else
            echo "::warning::未配置 DEBUG_KEYSTORE_BASE64：本次使用临时签名，产物不能覆盖安装已发布的版本。"
          fi

      - name: Test, lint and build
        run: ./gradlew --no-daemon --max-workers=2 :core:test :app:assembleDebug :app:assemblePreview :app:lintPreview

      - name: Package APKs and module
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: sh scripts/package.sh

      - name: Check signing certificate
        id: meta
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          signer=$(cat module/certificate.sha256)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$signer" = "$EXPECTED_SIGNER" ]; then status="✅ 与已发布版本相同，可覆盖安装"
          else status="⚠️ 与已发布版本不同，不能覆盖安装"; fi
          {
            echo "### 去他妈的鸡险 $version"
            echo "- 签名证书：\`$signer\`"
            echo "- $status"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$signer" != "$EXPECTED_SIGNER" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "::error::发布版本必须使用原签名密钥，请检查 DEBUG_KEYSTORE_BASE64。"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        id: build_primary
        continue-on-error: ${{ runner.environment == 'self-hosted' }}
        with:
          name: FuckPo0JiXian-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Retry NAS build upload (action-only direct HTTPS)
        if: always() && runner.environment == 'self-hosted' && steps.build_primary.outcome == 'failure'
        id: build_retry
        continue-on-error: true
        uses: actions/upload-artifact@v7
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/scripts/ci-artifact-direct.cjs
        with:
          # End in the source SHA so the unchanged draft-Release download pattern matches.
          name: FuckPo0JiXian-${{ steps.meta.outputs.version }}-retry2-${{ github.sha }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Require finalized NAS build artifact
        if: always() && runner.environment == 'self-hosted' && steps.meta.outcome == 'success'
        env:
          PRIMARY: ${{ steps.build_primary.outcome }}
          RETRY: ${{ steps.build_retry.outcome }}
        run: |
          if [[ "$PRIMARY" != success && "$RETRY" != success ]]; then
            echo 'No finalized NAS build artifact.' >&2
            exit 1
          fi

      - name: Keep lint report on failure
        if: failure()
        id: reports_primary
        continue-on-error: ${{ runner.environment == 'self-hosted' }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
            core/build/reports/
          retention-days: 7

      - name: Retry NAS failure report upload (action-only direct HTTPS)
        if: always() && runner.environment == 'self-hosted' && steps.reports_primary.outcome == 'failure'
        uses: actions/upload-artifact@v7
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/scripts/ci-artifact-direct.cjs
        with:
          name: reports-retry2-${{ github.sha }}
          path: |
            app/build/reports/
            core/build/reports/
          retention-days: 7

  # UI and recovery tests on a throwaway emulator without credentials (SafeTestRunner refuses anything else).
  # Not a release gate: emulators on shared runners are slow, and a flaky run should not block a tag.
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.fuckpo0jixian.UiTest,app.fuckpo0jixian.SlotUiTest,app.fuckpo0jixian.ReviewSafetyUiTest

      - name: Keep test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-reports-${{ github.sha }}
          path: app/build/reports/androidTests/
          retention-days: 7

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            tasks: ':desktop:test :desktop:packageDmg'
          - os: windows-latest
            name: windows
            tasks: ':desktop:test :desktop:packageMsi :desktop:packageExe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Test and package
        run: ./gradlew --no-daemon ${{ matrix.tasks }}

      - name: Collect installers
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          arch=$(uname -m | sed 's/x86_64/x64/; s/aarch64/arm64/')
          mkdir -p dist
          for f in desktop/build/compose/binaries/main/*/*.{dmg,msi,exe}; do
            [ -f "$f" ] || continue
            cp "$f" "dist/FuckPo0JiXian-Desktop-$version-${{ matrix.name }}-$arch.${f##*.}"
          done
          ls dist | grep -q . || { echo "::error::no installer produced"; exit 1; }
          # Only installers: redirecting to a manifest before the inner glob expands includes the manifest itself.
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum FuckPo0JiXian-Desktop-*; else shasum -a 256 FuckPo0JiXian-Desktop-*; fi > "SHA256SUMS-desktop-${{ matrix.name }}")
          echo "### 桌面端 ${{ matrix.name }} $version" >> "$GITHUB_STEP_SUMMARY"
          ls dist | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Show packaging log on failure
        if: failure()
        run: find desktop/build/compose/logs -name '*.txt' -exec sh -c 'echo "== $1"; tail -n 40 "$1"' _ {} \; || true

      - uses: actions/upload-artifact@v7
        with:
          name: FuckPo0JiXian-desktop-${{ matrix.name }}-${{ github.sha }}
          path: dist/*
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: FuckPo0JiXian-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 versionName $VERSION 不一致。"
            exit 1
          fi
          flags=""
          case "$VERSION" in *preview*|*alpha*|*beta*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft $flags \
            --title "去他妈的鸡险 $VERSION" --generate-notes
