# Builds, tests and packages AllowMate on GitHub's servers.
# - Every push / pull request: run core tests + lint, build APKs and the module ZIP, keep them as a downloadable artifact.
# - Pushing a tag like v0.5.0-preview: additionally creates a *draft* GitHub Release with those files attached.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Certificate of the key that signed every published preview so far. Phones can only upgrade in place,
  # and the runtime module only trusts the APK, when this matches. It is public (visible in any APK).
  EXPECTED_SIGNER: f6a7affdc167f75bae411a26979ee529500af8179475117fdeb94b1bb32426be

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5  # v6 adds proprietary caching terms

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            path="$RUNNER_TEMP/allowmate-debug.keystore"
            printf '%s' "$KEYSTORE" | base64 -d > "$path"
            echo "ALLOWMATE_KEYSTORE=$path" >> "$GITHUB_ENV"
            # Public certificate fingerprint only; the key itself never reaches the log.
            keytool -list -v -keystore "$path" -storepass android -alias androiddebugkey | grep 'SHA256:'
          else
            echo "::warning::未配置 DEBUG_KEYSTORE_BASE64：本次使用临时签名，产物不能覆盖安装已发布的版本。"
          fi

      - name: Test, lint and build
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:assemblePreview :app:lintPreview

      - name: Package APKs and module
        run: sh scripts/package.sh

      - name: Check signing certificate
        id: meta
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          signer=$(cat module/certificate.sha256)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$signer" = "$EXPECTED_SIGNER" ]; then status="✅ 与已发布版本相同，可覆盖安装"
          else status="⚠️ 与已发布版本不同，不能覆盖安装"; fi
          {
            echo "### 白名单随行 $version"
            echo "- 签名证书：\`$signer\`"
            echo "- $status"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$signer" != "$EXPECTED_SIGNER" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "::error::发布版本必须使用原签名密钥，请检查 DEBUG_KEYSTORE_BASE64。"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: AllowMate-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: dist/*
          retention-days: 30

      - name: Keep lint report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
            core/build/reports/
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AllowMate-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 versionName $VERSION 不一致。"
            exit 1
          fi
          flags=""
          case "$VERSION" in *preview*|*alpha*|*beta*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft $flags \
            --title "白名单随行 $VERSION" --generate-notes
